name: Deploy FastAPI to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Build Docker image
      run: docker build -t grocery-agent1 .

    - name: Deploy to VPS via SSH
  uses: appleboy/ssh-action@v0.1.10
  with:
    host: ${{ secrets.VPS_HOST }}
    username: ${{ secrets.VPS_USER }}
    key: ${{ secrets.VPS_SSH_KEY }}
    port: 22
    script: |
      cd ~/grocery-agent1
      git pull origin main
      docker stop grocery-agent1 || true
      docker rm grocery-agent1 || true
      docker build -t grocery-agent1 .
      docker run -d --name grocery-agent1 -p 80:80 grocery-agent1
